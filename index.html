<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تسجيلات جاهزة للمشايخة</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background-color: #f0f0f0;
    margin: 0;
    padding: 25px 20px 50px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 { color: #333; margin: 0 0 15px; font-size: 26px; }

  #last {
    background: #fff;
    border: 1px dashed #1a73e8;
    color: #333;
    font-size: 17px;
    padding: 8px 22px;
    border-radius: 10px;
    margin-bottom: 22px;
  }
  #last span { color: #1a73e8; font-weight: bold; }

  .item { width: 360px; margin-bottom: 18px; }

  a.link {
    display: block;
    background-color: #fff;
    color: #1a73e8;
    text-decoration: none;
    font-size: 22px;
    padding: 14px 20px;
    border-radius: 12px 12px 0 0;
    box-shadow: 0 2px 5px rgba(0,0,0,.1);
    text-align: center;
    border: 2px solid transparent;
    border-bottom: none;
    transition: all .2s;
  }
  a.link:hover { background-color: #e8f0fe; }
  a.link.last-clicked { border-color: #1a73e8; background: #e8f0fe; }

  .tracker {
    background: #fff;
    border-radius: 0 0 12px 12px;
    box-shadow: 0 2px 5px rgba(0,0,0,.1);
    padding: 10px;
  }
  .row { display: flex; gap: 6px; }
  .row input {
    flex: 1;
    font-size: 16px;
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-family: inherit;
    text-align: center;
  }
  .row input:focus { outline: 2px solid #1a73e8; border-color: transparent; }
  .row button {
    background: #1a73e8;
    color: #fff;
    border: none;
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    font-family: inherit;
  }
  .row button:hover { background: #1666c1; }

  .nums {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  .chip {
    background: #e8f0fe;
    color: #1a73e8;
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .chip button {
    background: none;
    border: none;
    color: #1a73e8;
    cursor: pointer;
    font-size: 16px;
    padding: 0;
    line-height: 1;
    opacity: .6;
  }
  .chip button:hover { opacity: 1; color: #d93025; }

  .count {
    font-size: 12px;
    color: #777;
    margin-top: 6px;
    text-align: left;
  }
</style>
</head>
<body>

<h1>تسجيلات جاهزة للمشايخة</h1>

<div id="last">آخر رابط ضغطت عليه: <span id="lastName">لا يوجد بعد</span></div>

<!-- 1 -->
<div class="item" data-key="albadr">
  <a class="link" href="https://www.youtube.com/playlist?list=PLWzzF688g_nhWBoII_vqw-h2p2yvx541V" target="_blank" data-name="عبدالرزاق البدر">عبدالرزاق البدر</a>
  <div class="tracker">
    <div class="row">
      <input class="num-input" type="text" placeholder="اكتب رقمًا أو أرقامًا مفصولة بفاصلة" title="مثال: 5, 12, 30">
      <button class="add-btn">إضافة</button>
    </div>
    <div class="nums"></div>
    <div class="count"></div>
  </div>
</div>

<div class="item" data-key="alshuwaier">
  <a class="link" href="https://www.youtube.com/playlist?list=PLWzzF688g_nhorglKsqOdvI_NUg5_3B75" target="_blank" data-name="عبدالسلام الشويعر">عبدالسلام الشويعر</a>
  <div class="tracker">
    <div class="row">

<div class="item" data-key="shanqiti">

  <div class="tracker">
    <div class="row">
      <input class="num-input" type="text" placeholder="اكتب رقمًا أو أرقامًا مفصولة بفاصلة" title="مثال: 5, 12, 30">

<div class="item" data-key="binbaz">
  <a class="link" href="https://www.youtube.com/playlist?list=PLWzzF688g_ni1Eg3y2bryW4-q5bv4DjDU" target="_blank" data-name="ابن باز">ابن باز</a>
  <div class="tracker">
    <div class="row">
      <input class="num-input" type="text" placeholder="اكتب رقمًا أو أرقامًا مفصولة بفاصلة" title="مثال: 5, 12, 30">

    </div>

<!-- 5 -->
<div class="item" data-key="binuthaymeen">
  <a class="link" href="https://www.youtube.com/playlist?list=PLWzzF688g_nhL67yIdQ-mGkMq1a1SUzWT" target="_blank" data-name="ابن عثيمين">ابن عثيمين</a>
  <div class="tracker">
    <div class="row">
      <input class="num-input" type="text" placeholder="اكتب رقمًا أو أرقامًا مفصولة بفاصلة" title="مثال: 5, 12, 30">
      <button class="add-btn">إضافة</button>
    </div>
    <div class="nums"></div>
    <div class="count"></div>
  </div>
</div>

<script>
  /* ===== تسجيل آخر رابط ضغطت عليه ===== */
  const links = document.querySelectorAll('a[data-name]');
  const lastNameEl = document.getElementById('lastName');

  function showLast(name) {
    lastNameEl.textContent = name;
    links.forEach(l => l.classList.toggle('last-clicked', l.dataset.name === name));
  }

  const savedLast = localStorage.getItem('lastClicked');
  if (savedLast) showLast(savedLast);

  links.forEach(link => {
    link.addEventListener('click', () => {
      localStorage.setItem('lastClicked', link.dataset.name);
      showLast(link.dataset.name);
    });
  });

  /* ===== سجل الأرقام لكل رابط على حدة ===== */
  document.querySelectorAll('.item').forEach(item => {
    const storeKey = 'nums_' + item.dataset.key;
    const input   = item.querySelector('.num-input');
    const addBtn  = item.querySelector('.add-btn');
    const numsBox = item.querySelector('.nums');
    const countEl = item.querySelector('.count');

    let nums = [];
    try { nums = JSON.parse(localStorage.getItem(storeKey) || '[]'); } catch (e) { nums = []; }

    function save() { localStorage.setItem(storeKey, JSON.stringify(nums)); }

    function render() {
      numsBox.innerHTML = '';
      nums.forEach(n => {
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.appendChild(document.createTextNode(n));

        const x = document.createElement('button');
        x.type = 'button';
        x.textContent = '×';
        x.title = 'حذف هذا الرقم';
        x.addEventListener('click', () => {
          nums = nums.filter(v => v !== n);
          save();
          render();
        });

        chip.appendChild(x);
        numsBox.appendChild(chip);
      });
      countEl.textContent = nums.length ? 'المسجّل: ' + nums.length : '';
    }

    function addNumbers() {
      const parts = input.value.split(/[\s,،]+/).filter(Boolean);
      let added = false;
      parts.forEach(p => {
        const v = p.trim();
        if (v && !nums.includes(v)) { nums.push(v); added = true; }
      });
      if (added) {
        // ترتيب: الأرقام أولًا تصاعديًا ثم غير الأرقام أبجديًا
        nums.sort((a, b) => {
          const na = parseFloat(a), nb = parseFloat(b);
          if (!isNaN(na) && !isNaN(nb)) return na - nb;
          if (!isNaN(na)) return -1;
          if (!isNaN(nb)) return 1;
          return a.localeCompare(b, 'ar');
        });
        save();
        render();
        input.value = '';
      }
      input.focus();
    }

    addBtn.addEventListener('click', addNumbers);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); addNumbers(); }
    });

    render();
  });
</script>

</body>
</html>
